# ---------------------------------------------------------------------------
# Megarax Item Enchanter AI
# ---------------------------------------------------------------------------

# Master switch.
EnableItemEnchanterAI = true

# Auto-enchant interval is fixed in code at 2 seconds.

# Allow usage while standing in town zones.
AllowInTown = true

# If false, players must unequip the item before using the system.
AllowEquippedItems = true

# Safer default: augmented items remain blocked.
AllowAugmentedItems = false

# Optional hard cap. 0 = use the scroll/server max from EnchantItemGroups.xml and EnchantItemData.xml.
MaxTargetEnchant = 0

# If true, blessed-scroll failure resets the item and stops the automation.
# If false, blessed-scroll failure resets the item and continues until max/no scrolls.
StopOnBlessedFail = true

# Scroll type permissions.
AllowNormalScrolls = true
AllowBlessedScrolls = true
AllowCrystalScrolls = true
