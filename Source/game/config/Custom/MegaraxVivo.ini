# ---------------------------------------------------------------------------
# MegaRax VIVO - transparent, player-driven world layer
# ---------------------------------------------------------------------------

# Master switches. Disabling VIVO does not disable or alter any existing system.
EnableMegaraxVivo = True
EnableMegaraxVivoBoard = True
MegaraxVivoAutoCreateTables = True

# Public presentation and receipt limits.
MegaraxVivoTimeZone = America/New_York
MegaraxVivoRecentReceiptLimit = 12
MegaraxVivoRecentContributorLimit = 8
MegaraxVivoChangeLogLimit = 10
MegaraxVivoShowContributionMessages = True
MegaraxVivoContributionMessageThreshold = 3

# Integrity and economy safety. VIVO creates no currency in the foundation phase.
MegaraxVivoMaximumSingleContribution = 100
MegaraxVivoDefaultPersonalDailyCap = 40

# Initial regional values. Existing Kingdom Economy balances are not changed.
MegaraxVivoDefaultSecurity = 50
MegaraxVivoDefaultSupply = 50
MegaraxVivoDefaultSpirit = 50

# Goddard vertical slice. PREPARATION keeps the need visible but rejects live
# contributions until its gameplay adapters have passed private validation.
MegaraxVivoPilotCycleKey = VIVO_GODDARD_EMBER_CARAVAN_1
MegaraxVivoPilotCycleTitle = La Caravana de las Brasas
MegaraxVivoPilotNeedKey = GODDARD_EMBER_CARAVAN_PREP
MegaraxVivoPilotNeedTitle = Goddard prepara la Caravana de las Brasas
MegaraxVivoPilotNeedDescription = Reunir suministros, trabajo artesanal, piezas recuperadas, servicios y escoltas.
MegaraxVivoPilotRegion = GODDARD
MegaraxVivoPilotStatus = PREPARATION
MegaraxVivoPilotGoal = 1000
MegaraxVivoPilotPersonalDailyCap = 40
MegaraxVivoPilotSuccessSupplyDelta = 10
MegaraxVivoPilotSuccessEffect = Abre una ruta y un mercader temporal durante 24 horas.
MegaraxVivoPilotFailureEffect = La caravana pequena parte con una emboscada adicional; los aportes quedan registrados.

# category:goal pairs. Goals should sum to the pilot total.
MegaraxVivoPilotCategories = SUPPLY:400;CRAFT:200;SPOIL:200;SERVICE:100;ESCORT:100

# Gameplay bridge for the Goddard pilot. It remains off until each source
# supplies a stable, unique event key and has passed private validation.
EnableMegaraxVivoGoddardAdapter = False
